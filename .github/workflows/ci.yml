name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
      - run: cargo build --release --workspace
      # On Windows the echo scenario never sees kumo-echo's READY through the
      # terminal (ConPTY) and hangs; macOS only until that's fixed.
      - if: runner.os == 'macOS'
        run: cargo run --release -p kumo-bench -- all
