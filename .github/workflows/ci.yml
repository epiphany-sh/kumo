name: ci

# Checks a change: pull requests only, so what reaches main went through
# one. What runs once it's merged is in `main.yml` and `release.yml`.
on:
  pull_request:

# A new push to a pull request cancels the run it replaces.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # main takes only release/X.Y.Z branches (each merge releases one), and
  # release branches take feature/…, feat/… or fix/…: packaging/branch-policy.sh.
  branch-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags
      - run: packaging/branch-policy.sh "$BASE" "$HEAD"
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check

  # The required checks run where GitHub always has runners: Linux and
  # Windows. macOS gets its own job below, which doesn't block a merge.
  clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      # Kept per pull request: its next pushes build only what changed.
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --no-fail-fast

  # The Flutter app: analyze and tests don't depend on the desktop.
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: kumo-ui
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5 # as in release.yml
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  # The platform Kumo ships for, in one job instead of three: GitHub's
  # macOS arm64 runners have gone days without capacity (jobs cancelled,
  # never started), so it isn't required. The release build in
  # `release.yml` still runs on macOS.
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5 # as in release.yml
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: kumo-ui
      - run: flutter test
        working-directory: kumo-ui
