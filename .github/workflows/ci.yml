name: ci

# Checks a change: pull requests only, so what reaches main went through
# one. What runs once it's merged is in `main.yml` and `release.yml`.
on:
  pull_request:

# A new push to a pull request cancels the run it replaces.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Known vulnerabilities in what's locked. Not required: a new advisory
  # shouldn't block unrelated changes, but it shows on every pull request.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  # main takes only release/X.Y.Z branches (each merge releases one), and
  # release branches take feature/…, feat/… or fix/…: packaging/branch-policy.sh.
  branch-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # tags
      - run: packaging/branch-policy.sh "$BASE" "$HEAD"
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check

  # The required checks run where GitHub always has runners: Linux and
  # Windows. macOS gets its own job below, which doesn't block a merge.
  clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show active-toolchain
      # Kept per pull request: its next pushes build only what changed.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --workspace --no-fail-fast

  # The Flutter app: analyze and tests don't depend on the desktop.
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: kumo-ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.5 # as in release.yml
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  # The platform Kumo ships for, in one job instead of three: GitHub's
  # macOS arm64 runners have gone days without capacity (jobs cancelled,
  # never started), so it isn't required. The release build in
  # `release.yml` still runs on macOS.
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.5 # as in release.yml
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: kumo-ui
      - run: flutter test
        working-directory: kumo-ui

  # The Windows download, built as `release.yml` builds it, so a change that
  # breaks it shows up here. Not required (yet); the app is kept a week to
  # try the change on Windows.
  windows-app:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the build number counts commits
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.5 # as in release.yml
          channel: stable
          cache: true
      - run: packaging/windows-zip.sh 0.0.0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Kumo-windows-x64
          path: kumo-ui/build/windows/x64/runner/Release/
          retention-days: 7
