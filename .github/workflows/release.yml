name: release

# Publishes Kumo X.Y.Z: the GitHub release (the macOS zip, appcast and
# install.sh; the Windows zip and install.ps1) and the Homebrew cask. macOS
# and Windows publish on their own (GitHub's macOS runners can go days
# without capacity): only macOS makes the release "Latest", which is what
# Sparkle, install.sh and brew download from (packaging/github-release.sh). A
# release/X.Y.Z branch merged into main (the only kind `ci` lets in) publishes
# X.Y.Z; so does a tag vX.Y.Z on a commit of main.
#
# Compiling runs code from every dependency, so it happens apart: *-build jobs
# have no secrets and a read-only token. *-publish jobs have the keys and write
# access, on another machine, and compile nothing: they don't run what they sign.
# One-time setup: docs/releasing.md.

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

# One at a time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # which branch a merge came from
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    env:
      # What's released: the merge, or the tag's commit.
      SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # tags
          persist-credentials: false
      - id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$(packaging/release-version.sh "release/${GITHUB_REF_NAME#v}") || {
              echo "::error::$GITHUB_REF_NAME isn't vX.Y.Z"
              exit 1
            }
            git merge-base --is-ancestor "$SHA" origin/main || {
              echo "::error::$GITHUB_REF_NAME isn't on main"
              exit 1
            }
          else
            # The pull request this merge closed, and its branch.
            branch=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" \
              --jq '[.[] | select(.base.ref == "main" and .merged_at != null)][0].head.ref // ""')
            # Or from git's merge message: "Merge pull request #N from owner/release/X.Y.Z".
            [ -n "$branch" ] || branch=$(git log -1 --format=%s "$SHA" | sed -n 's|^Merge pull request #[0-9]* from [^/]*/||p')
            version=$(packaging/release-version.sh "$branch" || true)
            if [ -n "$version" ] && git tag -l "v$version" | grep -q .; then
              echo "v$version is already released"
              version=
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Kumo ${version:-: nothing to release}"

  macos-build:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      FEED: https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0 # the build number counts commits
          persist-credentials: false

      - run: rustup show active-toolchain

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.5
          channel: stable

      - name: Build
        run: make bundle VERSION="$VERSION" FEED="$FEED"

      # tar: an artifact alone loses the bundle's symlinks and modes.
      - name: Pack the app
        run: tar -czf Kumo.app.tar.gz -C kumo-ui/build/macos/Build/Products/Release Kumo.app

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-app
          path: Kumo.app.tar.gz
          retention-days: 7
          if-no-files-found: error

  macos-publish:
    needs: [version, macos-build]
    runs-on: macos-latest
    permissions:
      contents: write # the release and its tag
      id-token: write # the attestation
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SHA: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0 # the build number counts commits
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-app

      - name: Unpack the app
        run: |
          mkdir -p kumo-ui/build/macos/Build/Products/Release
          tar -xzf Kumo.app.tar.gz -C kumo-ui/build/macos/Build/Products/Release
          rm Kumo.app.tar.gz

      - name: Signing identity ("Kumo Development")
        env:
          P12: ${{ secrets.KUMO_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.KUMO_SIGNING_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p ci "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"

      - name: Sign
        run: make sign

      - name: Package
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          RELEASE_ORG: ${{ github.repository_owner }}
        run: |
          echo "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle-key"
          SPARKLE_KEY_FILE="$RUNNER_TEMP/sparkle-key" make package VERSION="$VERSION" RELEASE_ORG="$RELEASE_ORG"
          rm "$RUNNER_TEMP/sparkle-key"

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/Kumo-${{ needs.version.outputs.version }}.zip

      # Tags the commit (for a merge) only once it's built: a failed build
      # leaves no tag, and its number is used again (unless Windows already
      # published it: then re-run this job from Actions). A tag made with
      # this token doesn't start another run. A release made by hand on
      # GitHub (which tags it) gets the files instead.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          packaging/github-release.sh --latest "$VERSION" "$SHA" \
            "dist/Kumo-$VERSION.zip" dist/Kumo.zip dist/Kumo.zip.sha256 dist/appcast.xml dist/install.sh dist/install.ps1

      - name: Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP: ${{ github.repository_owner }}/homebrew-kumo
        run: |
          git clone "https://x-access-token:$TAP_TOKEN@github.com/$TAP.git" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          cp dist/kumo.rb "$RUNNER_TEMP/tap/Casks/kumo.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "kumo release"
          git config user.email "release@users.noreply.github.com"
          git add Casks/kumo.rb
          git commit -m "kumo $VERSION"
          git push origin HEAD:main

  windows-build:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0 # the build number counts commits
          persist-credentials: false

      - run: rustup show active-toolchain

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.5
          channel: stable

      - name: Build and package
        env:
          RELEASE_REPO: ${{ github.repository }}
        run: packaging/windows-zip.sh "$VERSION"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-app
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # Doesn't wait for macOS, and doesn't make the release "Latest":
  # install.ps1 finds the newest release with a Windows zip.
  windows-publish:
    needs: [version, windows-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release and its tag
      id-token: write # the attestation
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SHA: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-app
          path: dist

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/Kumo-${{ needs.version.outputs.version }}-windows-x64.zip

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          packaging/github-release.sh "$VERSION" "$SHA" \
            "dist/Kumo-$VERSION-windows-x64.zip" "dist/Kumo-$VERSION-windows-x64.zip.sha256" dist/install.ps1
