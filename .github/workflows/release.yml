name: release

# Publishes Kumo X.Y.Z: the GitHub release (zip, appcast, install.sh) and
# the Homebrew cask. A release/X.Y.Z branch merged into main (the only kind
# `ci` lets in) publishes X.Y.Z; so does a tag vX.Y.Z pushed by hand.
# One-time setup: docs/releasing.md.

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write
  pull-requests: read # which branch a merge came from

# One at a time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    env:
      # What's released: the merge, or the tag's commit.
      SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags
      - id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            # The pull request this merge closed, and its branch.
            branch=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" \
              --jq '[.[] | select(.base.ref == "main" and .merged_at != null)][0].head.ref // ""')
            # Or from git's merge message: "Merge pull request #N from owner/release/X.Y.Z".
            [ -n "$branch" ] || branch=$(git log -1 --format=%s "$SHA" | sed -n 's|^Merge pull request #[0-9]* from [^/]*/||p')
            version=$(packaging/release-version.sh "$branch" || true)
            if [ -n "$version" ] && git tag -l "v$version" | grep -q .; then
              echo "v$version is already released"
              version=
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Kumo ${version:-: nothing to release}"

  macos:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SHA: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0 # the build number counts commits

      - run: rustup show active-toolchain

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable

      - name: Signing identity ("Kumo Development")
        env:
          P12: ${{ secrets.KUMO_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.KUMO_SIGNING_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p ci "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"

      - name: Build, sign and package
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          echo "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle-key"
          SPARKLE_KEY_FILE="$RUNNER_TEMP/sparkle-key" \
            make release VERSION="$VERSION" RELEASE_ORG="${{ github.repository_owner }}"
          rm "$RUNNER_TEMP/sparkle-key"

      # Tags the commit (for a merge) only once it's built: a failed build
      # leaves no tag, and its number is used again. A tag made with this
      # token doesn't start another run. A release made by hand on GitHub
      # (which tags it) gets the files instead.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=("dist/Kumo-$VERSION.zip" dist/Kumo.zip dist/appcast.xml dist/install.sh)
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "${files[@]}" --clobber
          else
            gh release create "v$VERSION" --target "$SHA" --title "Kumo $VERSION" --generate-notes "${files[@]}"
          fi

      - name: Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          tap="${{ github.repository_owner }}/homebrew-kumo"
          git clone "https://x-access-token:$TAP_TOKEN@github.com/$tap.git" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          cp dist/kumo.rb "$RUNNER_TEMP/tap/Casks/kumo.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "kumo release"
          git config user.email "release@users.noreply.github.com"
          git add Casks/kumo.rb
          git commit -m "kumo $VERSION"
          git push origin HEAD:main
