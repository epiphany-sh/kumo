[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/application",
    "crates/infrastructure",
    "crates/proto",
    "crates/grpc",
    "crates/daemon",
    "crates/bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Internal crates (layers, inner to outer).
kumo-domain = { path = "crates/domain" }
kumo-application = { path = "crates/application" }
kumo-infrastructure = { path = "crates/infrastructure" }
kumo-proto = { path = "crates/proto" }
kumo-grpc = { path = "crates/grpc" }
kumod = { path = "crates/daemon" }

# gRPC / protobuf
tonic = "0.14.8"
tonic-prost = "0.14.8"
tonic-prost-build = "0.14.8"
prost = "0.14.4"
protoc-bin-vendored = "3.3.0"

# Async runtime
tokio = "1.54.1"
tokio-stream = { version = "0.1.19", features = ["sync"] }
futures = "0.3.34"

# Terminal
portable-pty = "0.9.0"

# Utilities
bytes = "1.12.1"
thiserror = "2.0.21"
anyhow = "1.0.104"
uuid = { version = "1.29.0", features = ["v4"] }
subtle = "2.6.1"
getrandom = "0.4.3"
hex = "0.4.3"
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
clap = { version = "4.6.7", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
hdrhistogram = "7.6.0"
tempfile = "3.27.0"
rusqlite = { version = "0.41.0", features = ["bundled"] }
notify = "8.2.1"
libc = "0.2"
windows-sys = "0.61.2"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = "line-tables-only"
codegen-units = 1
lto = "thin"
