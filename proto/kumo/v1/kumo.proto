// Kumo daemon API, v1.
//
// Transport: gRPC over HTTP/2 on TCP loopback. Every call carries
// `authorization: Bearer <token>` (token from the discovery file).
// Keep this file backwards compatible once the UI consumes it:
// never reuse or renumber fields, only add.
syntax = "proto3";

package kumo.v1;

// ---------------------------------------------------------------------------
// Core
// ---------------------------------------------------------------------------

service Core {
  // Version handshake. Clients must refuse to operate if
  // `server_api_version` differs from their own.
  rpc Hello(HelloRequest) returns (HelloResponse);
}

message HelloRequest {
  uint32 client_api_version = 1;
  string client_name = 2;
}

message HelloResponse {
  uint32 server_api_version = 1;
  string server_version = 2;
  uint64 server_time_unix_nanos = 3;
}

// ---------------------------------------------------------------------------
// Terminals
// ---------------------------------------------------------------------------

service Terminals {
  rpc Open(OpenRequest) returns (OpenResponse);
  // First client message must be `attach`. After that: `data` / `resize`.
  // The server streams output batches and, last, `exited`.
  rpc Attach(stream TerminalInput) returns (stream TerminalOutput);
  // Kills the process (if still running) and forgets the session.
  rpc Close(CloseRequest) returns (CloseResponse);
  rpc List(ListRequest) returns (ListResponse);
}

message OpenRequest {
  string program = 1;
  repeated string args = 2;
  // Empty means the daemon's working directory.
  string cwd = 3;
  map<string, string> env = 4;
  uint32 cols = 5;
  uint32 rows = 6;
}

message OpenResponse {
  string terminal_id = 1;
}

message TerminalInput {
  oneof kind {
    AttachTo attach = 1;
    bytes data = 2;
    Resize resize = 3;
  }
}

message AttachTo {
  string terminal_id = 1;
  // Send the bounded replay buffer before live output. Replay and live
  // output never overlap: `seq` is strictly increasing across both.
  bool replay_scrollback = 2;
}

message Resize {
  uint32 cols = 1;
  uint32 rows = 2;
}

message TerminalOutput {
  oneof kind {
    OutputBatch output = 1;
    Exited exited = 2;
    // M2: ScreenUpdate (dirty-line diffs).
  }
}

message OutputBatch {
  // Monotonic per session, starting at 1.
  uint64 seq = 1;
  bytes data = 2;
  // When the first coalesced chunk was read from the PTY (latency tracing).
  uint64 first_read_unix_nanos = 3;
  // How many PTY reads were coalesced into this batch.
  uint32 chunks = 4;
}

message Exited {
  int32 exit_code = 1;
}

message CloseRequest {
  string terminal_id = 1;
}

message CloseResponse {}

message ListRequest {}

message ListResponse {
  repeated TerminalInfo terminals = 1;
}

message TerminalInfo {
  string terminal_id = 1;
  string program = 2;
  bool exited = 3;
  int32 exit_code = 4;
  // Where it started (absolute); empty if it started in the daemon's own
  // directory. Lets a UI put terminals back with their worktree.
  string cwd = 5;
}

// ---------------------------------------------------------------------------
// Workspace: namespaces, repositories and worktrees
// ---------------------------------------------------------------------------
//
// Repos are identified by the absolute path of their main checkout and
// worktrees by their path. The daemon pushes the whole workspace on every
// change (last wins): small, and the UI never has to merge events.

service Workspace {
  // Current snapshot first, then a new one after every change.
  rpc Watch(WatchWorkspaceRequest) returns (stream WorkspaceSnapshot);
  // Re-reads git state (e.g. when the window gets focus).
  rpc Refresh(RefreshWorkspaceRequest) returns (RefreshWorkspaceResponse);
  // Git repositories found on disk, to pick from when editing a namespace.
  rpc DiscoverRepos(DiscoverReposRequest) returns (DiscoverReposResponse);
  // Creates (empty id) or replaces a namespace. Unknown repo paths are
  // registered; they must be git repositories.
  rpc SaveNamespace(SaveNamespaceRequest) returns (SaveNamespaceResponse);
  // Only the group: repositories and worktrees stay on disk.
  rpc DeleteNamespace(DeleteNamespaceRequest) returns (DeleteNamespaceResponse);
  rpc CreateWorktree(CreateWorktreeRequest) returns (CreateWorktreeResponse);
  // `git worktree remove`; the branch stays. The main checkout can't be removed.
  rpc RemoveWorktree(RemoveWorktreeRequest) returns (RemoveWorktreeResponse);
  // Branches to start a worktree from or check out.
  rpc ListBranches(ListBranchesRequest) returns (ListBranchesResponse);
}

message WatchWorkspaceRequest {}

message WorkspaceSnapshot {
  // Increases with every change.
  uint64 version = 1;
  repeated Namespace namespaces = 2;
  // Every repository referenced by a namespace.
  repeated Repository repositories = 3;
}

message Namespace {
  string id = 1;
  string name = 2;
  // Repository paths, in sidebar order.
  repeated string repo_paths = 3;
  bool collapsed = 4;
}

enum GitHost {
  GIT_HOST_UNSPECIFIED = 0;
  GIT_HOST_LOCAL = 1; // no remote
  GIT_HOST_GITHUB = 2;
  GIT_HOST_GITLAB = 3;
  GIT_HOST_BITBUCKET = 4;
  GIT_HOST_OTHER = 5;
}

message Repository {
  // Absolute path of the main checkout: the repository's identity.
  string path = 1;
  string name = 2;
  GitHost host = 3;
  // "owner/name" on the host, empty without a remote.
  string full_name = 4;
  string remote_url = 5;
  repeated Worktree worktrees = 6;
  // Set when git could not be read (moved or deleted folder…).
  string error = 7;
}

message Worktree {
  string path = 1;
  // Empty when HEAD is detached.
  string branch = 2;
  string head = 3;
  bool is_main = 4;
  bool locked = 5;
  WorktreeStatus status = 6;
}

message WorktreeStatus {
  // Files with staged, unstaged or untracked changes.
  uint32 changed_files = 1;
  uint32 ahead = 2;
  uint32 behind = 3;
  // e.g. "origin/main"; empty if the branch was never pushed.
  string upstream = 4;
}

message RefreshWorkspaceRequest {}
message RefreshWorkspaceResponse {}

message DiscoverReposRequest {
  // Folders to scan; empty means the usual ones (~/workspace, ~/dev, ~/code…).
  repeated string roots = 1;
}

message DiscoverReposResponse {
  repeated RepoCandidate candidates = 1;
}

message RepoCandidate {
  string path = 1;
  string name = 2;
  GitHost host = 3;
  string full_name = 4;
  uint32 worktree_count = 5;
}

message SaveNamespaceRequest {
  // Empty to create one.
  string id = 1;
  string name = 2;
  repeated string repo_paths = 3;
  bool collapsed = 4;
  // Position among namespaces (past the end appends). Unset: new ones are
  // appended, existing ones keep their place.
  optional uint32 position = 5;
}

message SaveNamespaceResponse {
  string id = 1;
}

message DeleteNamespaceRequest {
  string id = 1;
}

message DeleteNamespaceResponse {}

message CreateWorktreeRequest {
  string repo_path = 1;
  string branch = 2;
  // Create `branch` from `base` (default: the repo's current HEAD); false
  // checks out an existing branch.
  bool create_branch = 3;
  string base = 4;
  // Where to put it; "~" is expanded. Empty: ~/wt/<repo>/<branch>.
  string path = 5;
}

message CreateWorktreeResponse {
  Worktree worktree = 1;
}

message RemoveWorktreeRequest {
  string repo_path = 1;
  string worktree_path = 2;
  // Also remove it with uncommitted changes.
  bool force = 3;
}

message RemoveWorktreeResponse {}

message ListBranchesRequest {
  string repo_path = 1;
}

message ListBranchesResponse {
  // Branch checked out in the main checkout; empty if detached.
  string current = 1;
  repeated string local = 2;
  // e.g. "origin/feat/x", without the remotes' HEAD aliases.
  repeated string remote = 3;
}

// ---------------------------------------------------------------------------
// Git: changes, files and history of one worktree
// ---------------------------------------------------------------------------
//
// Every call names a worktree of a repository in the workspace; file paths
// are relative to it and can't leave it.

service Git {
  // Status now, then again whenever files or the index change.
  rpc WatchStatus(WatchStatusRequest) returns (stream WorktreeChanges);
  // Tracked and untracked (not ignored) files.
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse);
  // Renames or moves a file or folder; its new folders are created. Fails
  // when something is already there.
  rpc MovePath(MovePathRequest) returns (GitActionResponse);
  // Deletes files, or folders with everything in them.
  rpc RemovePaths(PathsRequest) returns (GitActionResponse);
  // The whole file with its changes (unchanged lines as context).
  rpc Diff(DiffRequest) returns (DiffResponse);
  rpc Stage(PathsRequest) returns (GitActionResponse);
  rpc Unstage(PathsRequest) returns (GitActionResponse);
  // Back to HEAD (staged and working tree). Untracked files are left alone.
  rpc Restore(PathsRequest) returns (GitActionResponse);
  rpc Commit(CommitRequest) returns (CommitResponse);
  rpc Push(WorktreeRequest) returns (GitActionResponse);
  rpc Fetch(WorktreeRequest) returns (GitActionResponse);
  // `git pull --ff-only`: fails instead of creating a merge commit.
  rpc Pull(WorktreeRequest) returns (GitActionResponse);
  // `git reset --soft HEAD~1`: the changes stay, staged.
  rpc UndoLastCommit(WorktreeRequest) returns (GitActionResponse);
  rpc Log(LogRequest) returns (LogResponse);
}

message WorktreeRequest {
  string worktree_path = 1;
}

message WatchStatusRequest {
  string worktree_path = 1;
}

enum ChangeKind {
  CHANGE_KIND_NONE = 0;
  CHANGE_KIND_MODIFIED = 1;
  CHANGE_KIND_ADDED = 2;
  CHANGE_KIND_DELETED = 3;
  CHANGE_KIND_RENAMED = 4;
  CHANGE_KIND_UNTRACKED = 5;
  CHANGE_KIND_TYPE_CHANGED = 6;
}

message FileChange {
  string path = 1;
  // Renames: where it came from.
  string old_path = 2;
  // Staged (index vs HEAD) and unstaged (working tree vs index) changes.
  ChangeKind staged = 3;
  ChangeKind unstaged = 4;
  bool conflict = 5;
  uint32 additions = 6;
  uint32 deletions = 7;
  bool binary = 8;
}

message WorktreeChanges {
  // Empty when HEAD is detached.
  string branch = 1;
  string upstream = 2;
  uint32 ahead = 3;
  uint32 behind = 4;
  // Uncommitted changes, staged or not.
  repeated FileChange working = 5;
  // Committed on this branch since it left `base` (e.g. "origin/main").
  string base = 6;
  repeated FileChange committed = 7;
}

message ListFilesRequest {
  string worktree_path = 1;
}

message ListFilesResponse {
  repeated string paths = 1;
  // More files than the daemon lists at once.
  bool truncated = 2;
}

message ReadFileRequest {
  string worktree_path = 1;
  string path = 2;
}

message ReadFileResponse {
  bytes content = 1;
  bool binary = 2;
  // Only the first bytes were sent (big file).
  bool truncated = 3;
  uint64 size = 4;
}

message WriteFileRequest {
  string worktree_path = 1;
  string path = 2;
  bytes content = 3;
}

message WriteFileResponse {}

message MovePathRequest {
  string worktree_path = 1;
  string from = 2;
  string to = 3;
}

enum DiffScope {
  // Working tree (staged and not) vs HEAD.
  DIFF_SCOPE_WORKING = 0;
  // HEAD vs the branch base.
  DIFF_SCOPE_COMMITTED = 1;
}

message DiffRequest {
  string worktree_path = 1;
  string path = 2;
  DiffScope scope = 3;
}

enum DiffLineKind {
  DIFF_LINE_KIND_CONTEXT = 0;
  DIFF_LINE_KIND_ADDED = 1;
  DIFF_LINE_KIND_DELETED = 2;
}

message DiffLine {
  DiffLineKind kind = 1;
  string text = 2;
}

message DiffResponse {
  repeated DiffLine lines = 1;
  bool binary = 2;
}

message PathsRequest {
  string worktree_path = 1;
  repeated string paths = 2;
}

message GitActionResponse {}

message CommitRequest {
  string worktree_path = 1;
  string message = 2;
  // Stage every change first (`git add -A`).
  bool all = 3;
  bool amend = 4;
}

message CommitResponse {
  string sha = 1;
  string short_sha = 2;
}

message LogRequest {
  string worktree_path = 1;
  uint32 limit = 2;
}

message Commit {
  string sha = 1;
  string short_sha = 2;
  string subject = 3;
  string author = 4;
  uint64 time_unix = 5;
}

message LogResponse {
  repeated Commit commits = 1;
}

// ---------------------------------------------------------------------------
// Agents: the user's own coding-agent CLIs, run in worktrees
// ---------------------------------------------------------------------------
//
// Kumo never proxies models: a provider is a CLI the user installed and
// signed in to (Claude Code, Codex, Gemini, Copilot, Grok… or any command).
// Agents are optional: with none connected, everything else works.

service Agents {
  // Known CLIs (installed or not) plus the user's custom ones.
  rpc ListProviders(ListProvidersRequest) returns (ListProvidersResponse);
  // Creates (empty id) a custom provider or updates any provider.
  rpc SaveProvider(SaveProviderRequest) returns (AgentProvider);
  // Custom providers only; known ones are disabled instead.
  rpc DeleteProvider(DeleteProviderRequest) returns (DeleteProviderResponse);
  // Runs `<program> --version`.
  rpc TestProvider(TestProviderRequest) returns (TestProviderResponse);
  // Opens a terminal running the CLI's own sign-in; Kumo never sees
  // credentials.
  rpc LoginProvider(LoginProviderRequest) returns (LoginProviderResponse);
  rpc Start(StartAgentRequest) returns (AgentSession);
  // Kills the agent's process.
  rpc Stop(StopAgentRequest) returns (StopAgentResponse);
  // Sends a ticket or page to a running agent: the text is typed into its
  // terminal and submitted, and the item joins its context.
  rpc AddContext(AddAgentContextRequest) returns (AgentSession);
  // Forgets a finished session.
  rpc Dismiss(DismissAgentRequest) returns (DismissAgentResponse);
  // Every session now, then again whenever one changes (last wins).
  rpc Watch(WatchAgentsRequest) returns (stream AgentsSnapshot);
}

message AgentProvider {
  string id = 1;
  string name = 2;
  // Two-letter badge, e.g. "CC".
  string short = 3;
  string program = 4;
  // Extra arguments, shell-quoted (e.g. "--model x").
  string args = 5;
  bool custom = 6;
  bool enabled = 7;
  bool is_default = 8;
  // Found on the user's PATH.
  bool installed = 9;
  string resolved_path = 10;
  // How to install it (known CLIs).
  string install_hint = 11;
  // The prompt can be passed at start; otherwise Kumo types it in.
  bool takes_prompt_argument = 12;
  bool has_login = 13;
}

message ListProvidersRequest {}

message ListProvidersResponse {
  repeated AgentProvider providers = 1;
}

message SaveProviderRequest {
  // Empty: a new custom provider.
  string id = 1;
  string name = 2;
  string program = 3;
  string args = 4;
  bool enabled = 5;
  bool is_default = 6;
}

message DeleteProviderRequest {
  string id = 1;
}

message DeleteProviderResponse {}

message TestProviderRequest {
  string id = 1;
}

message TestProviderResponse {
  // e.g. "2.1.0 (Claude Code)".
  string version = 1;
}

message LoginProviderRequest {
  string id = 1;
}

message LoginProviderResponse {
  string terminal_id = 1;
}

message StartAgentRequest {
  // Empty: the default provider.
  string provider_id = 1;
  string worktree_path = 2;
  string prompt = 3;
  // Shown on the card; empty uses the prompt's first line.
  string title = 4;
  uint32 cols = 5;
  uint32 rows = 6;
  // What the prompt hands it (a ticket, a page), for the record.
  repeated AgentContext context = 7;
}

enum AgentContextKind {
  AGENT_CONTEXT_KIND_TASK = 0;
  AGENT_CONTEXT_KIND_DOC = 1;
}

// A ticket or page an agent was given.
message AgentContext {
  AgentContextKind kind = 1;
  // e.g. "PRC-412 · Bulk discounts by category".
  string title = 2;
  // Where it lives, e.g. "Jira" or "Confluence · Pricing".
  string detail = 3;
  string url = 4;
}

enum AgentEventKind {
  AGENT_EVENT_KIND_STARTED = 0;
  AGENT_EVENT_KIND_EDITED = 1;
  AGENT_EVENT_KIND_RAN = 2;
  AGENT_EVENT_KIND_READ = 3;
  AGENT_EVENT_KIND_SEARCHED = 4;
  // Another tool, named in the text.
  AGENT_EVENT_KIND_TOOL = 5;
  // Its turn ended; the text is what it said last.
  AGENT_EVENT_KIND_WAITING = 6;
  // It was sent a ticket or page (the text is its title).
  AGENT_EVENT_KIND_CONTEXT = 7;
  // The process ended; the text says how.
  AGENT_EVENT_KIND_EXITED = 8;
}

// One step of an agent's timeline, read from its terminal.
message AgentEvent {
  uint64 at_unix_ms = 1;
  AgentEventKind kind = 2;
  // The file, command or tool it acted on.
  string text = 3;
}

enum AgentState {
  // Producing output.
  AGENT_STATE_WORKING = 0;
  // Quiet, or it rang the terminal bell / sent a notification: your turn.
  AGENT_STATE_NEEDS_INPUT = 1;
  AGENT_STATE_EXITED = 2;
}

message AgentSession {
  string id = 1;
  string provider_id = 2;
  string provider_name = 3;
  string short = 4;
  string worktree_path = 5;
  string terminal_id = 6;
  string title = 7;
  string prompt = 8;
  AgentState state = 9;
  int32 exit_code = 10;
  uint64 started_unix_ms = 11;
  uint64 state_since_unix_ms = 12;
  // Last readable line of output.
  string last_line = 13;
  repeated AgentContext context = 14;
  // Oldest first; the last 80.
  repeated AgentEvent events = 15;
}

message StopAgentRequest {
  string id = 1;
}

message StopAgentResponse {}

message AddAgentContextRequest {
  string id = 1;
  AgentContext context = 2;
  // Typed into the agent's terminal and submitted; empty only records it.
  string text = 3;
}

message DismissAgentRequest {
  string id = 1;
}

message DismissAgentResponse {}

message WatchAgentsRequest {}

message AgentsSnapshot {
  uint64 version = 1;
  repeated AgentSession sessions = 2;
}

// ---------------------------------------------------------------------------
// Tasks
// ---------------------------------------------------------------------------

// Tasks from the tools the user already works with. The board is served
// from a local cache and pushed whenever a source's tasks change; sources
// are re-read in the background (on file changes for local ones, on an
// interval for APIs). Nothing here waits on the network except Test,
// SetStatus and Detect.
service Tasks {
  // The board now, then again whenever it changes (last wins). Each update
  // carries every source but only the task lists that changed.
  rpc Watch(WatchTasksRequest) returns (stream TasksUpdate);
  // Sources found on this machine that aren't configured yet (Obsidian
  // vaults, Bear, a signed-in `gh`).
  rpc Detect(DetectSourcesRequest) returns (DetectSourcesResponse);
  // Checks options and credentials without saving them.
  rpc TestSource(TestSourceRequest) returns (TestSourceResponse);
  // Creates (empty id) or updates a source.
  rpc SaveSource(SaveSourceRequest) returns (TaskSource);
  // Forgets a source, its cached tasks, links and stored token.
  rpc DeleteSource(DeleteSourceRequest) returns (DeleteSourceResponse);
  // Reads a source (empty id: all) now.
  rpc Sync(SyncTasksRequest) returns (SyncTasksResponse);
  // Writes the status back to the source (only `writable` ones).
  rpc SetStatus(SetTaskStatusRequest) returns (Task);
  // Records that a task is being worked on in a worktree.
  rpc Link(LinkTaskRequest) returns (TaskLink);
  rpc Unlink(UnlinkTaskRequest) returns (UnlinkTaskResponse);
  // The whole ticket: description, acceptance criteria, sub-tasks, links,
  // attachments and comments. Answered from the daemon's cache when fresh
  // (or when the source can't be reached: then `stale` is set).
  rpc GetTask(GetTaskRequest) returns (TaskDetail);
}

enum TaskSourceKind {
  TASK_SOURCE_KIND_UNSPECIFIED = 0;
  // Options: vault (folder).
  TASK_SOURCE_KIND_OBSIDIAN = 1;
  // Options: database (optional path to Bear's database).
  TASK_SOURCE_KIND_BEAR = 2;
  // Options: query (GitHub search syntax). Signs in through `gh`.
  TASK_SOURCE_KIND_GITHUB = 3;
  // Options: site, email, jql. Secret: API token.
  TASK_SOURCE_KIND_JIRA = 4;
  // Options: project (optional). Secret: API token.
  TASK_SOURCE_KIND_TODOIST = 5;
}

enum TaskStatus {
  TASK_STATUS_TODO = 0;
  TASK_STATUS_DOING = 1;
  TASK_STATUS_REVIEW = 2;
  TASK_STATUS_DONE = 3;
}

enum TaskPriority {
  TASK_PRIORITY_NONE = 0;
  TASK_PRIORITY_LOW = 1;
  TASK_PRIORITY_MEDIUM = 2;
  TASK_PRIORITY_HIGH = 3;
  TASK_PRIORITY_URGENT = 4;
}

message TaskSource {
  string id = 1;
  TaskSourceKind kind = 2;
  string name = 3;
  map<string, string> options = 4;
  bool enabled = 5;
  // Two-letter badge, e.g. "JI".
  string badge = 6;
  // Needs an API token, and whether one is stored (in the OS keychain).
  bool needs_secret = 7;
  bool has_secret = 8;
  // Statuses Kumo can write back.
  repeated TaskStatus writable = 9;
  bool syncing = 10;
  // 0: not read since it was configured or the daemon started.
  uint64 last_synced_unix_ms = 11;
  // Why the last read failed; its cached tasks are still shown.
  string error = 12;
  uint32 task_count = 13;
}

message Task {
  // The source's id, a slash, and the id the task has in its source.
  string id = 1;
  string source_id = 2;
  // Short label: issue key (PRC-412, #18), project or note.
  string key = 3;
  string title = 4;
  TaskStatus status = 5;
  TaskPriority priority = 6;
  // YYYY-MM-DD, or empty.
  string due = 7;
  // Opens the task in its tool.
  string url = 8;
  // Repository, project or folder.
  string context = 9;
  repeated string labels = 10;
  uint64 updated_unix_ms = 11;
  // Branch to work on it, e.g. "feat/PRC-412-bulk-discounts".
  string suggested_branch = 12;

  TaskType type = 13;
  // The source's own name for the type ("Story", "Sub-task").
  string type_name = 14;
  // The source's own status ("Code Review", "QA"); `status` is its column.
  string source_status = 15;
  optional Person assignee = 16;
  // How the task relates to the user. Today only ASSIGNED is filled; room
  // for REPORTED and WATCHING later.
  repeated TaskRelation relations = 17;
  // The user's own: assigned to them, or from a personal source (Obsidian,
  // Bear, Todoist). What "Mine" shows.
  bool mine = 18;
  // Story points; 0 = none.
  double points = 19;
  uint32 subtasks_done = 20;
  uint32 subtasks_total = 21;
  uint32 comment_count = 22;
  // Epic, or parent of a sub-task.
  optional TaskRef parent = 23;
  // An issue that blocks this one isn't done yet.
  bool blocked = 24;
  optional Sprint sprint = 25;
}

enum TaskType {
  TASK_TYPE_UNSPECIFIED = 0;
  TASK_TYPE_STORY = 1;
  TASK_TYPE_BUG = 2;
  TASK_TYPE_TASK = 3;
  TASK_TYPE_SUBTASK = 4;
  TASK_TYPE_EPIC = 5;
  // A GitHub issue.
  TASK_TYPE_ISSUE = 6;
  // A note checkbox or a to-do (Obsidian, Bear, Todoist).
  TASK_TYPE_TODO = 7;
}

enum TaskRelation {
  TASK_RELATION_UNSPECIFIED = 0;
  TASK_RELATION_ASSIGNED = 1;
  TASK_RELATION_REPORTED = 2;
  TASK_RELATION_WATCHING = 3;
}

message Person {
  // The source's id (Jira accountId, GitHub login).
  string id = 1;
  string name = 2;
  // "AG"; one letter for one-word names.
  string initials = 3;
  // The signed-in user.
  bool you = 4;
}

enum SprintState {
  SPRINT_STATE_UNSPECIFIED = 0;
  SPRINT_STATE_CLOSED = 1;
  SPRINT_STATE_ACTIVE = 2;
  SPRINT_STATE_FUTURE = 3;
}

message Sprint {
  string name = 1;
  SprintState state = 2;
  // 0 = unknown.
  uint64 start_unix_ms = 3;
  uint64 end_unix_ms = 4;
}

// Another ticket, as a detail or a card mentions it.
message TaskRef {
  // Kumo's id ("source/external") when it's a task of a source; empty for
  // tickets the source didn't send (opening it asks GetTask anyway).
  string id = 1;
  string key = 2;
  string title = 3;
  TaskType type = 4;
  string source_status = 5;
  TaskStatus status = 6;
  optional Person assignee = 7;
  // Epics: a palette name ("violet", "teal", "amber"…), empty = by key.
  string color = 8;
  string url = 9;
}

enum LinkKind {
  LINK_KIND_OTHER = 0;
  LINK_KIND_BLOCKS = 1;
  LINK_KIND_BLOCKED_BY = 2;
  LINK_KIND_RELATES = 3;
  LINK_KIND_DUPLICATES = 4;
  LINK_KIND_DUPLICATED_BY = 5;
}

message LinkedTask {
  LinkKind kind = 1;
  // The source's wording ("is blocked by", "clones").
  string relation = 2;
  TaskRef task = 3;
}

message TaskAttachment {
  string name = 1;
  // "PNG image", "CSV", "PDF".
  string kind = 2;
  uint64 size_bytes = 3;
  string url = 4;
}

message TaskComment {
  Person author = 1;
  uint64 created_unix_ms = 2;
  // Markdown.
  string body = 3;
}

message TimeTracking {
  // The source's own wording ("3d", "1d 4h"), and seconds for the bar.
  string estimate = 1;
  string logged = 2;
  string remaining = 3;
  uint64 estimate_seconds = 4;
  uint64 logged_seconds = 5;
  uint64 remaining_seconds = 6;
}

message GetTaskRequest {
  string id = 1;
  // Ask the source even if the cached detail is fresh.
  bool refresh = 2;
}

message TaskDetail {
  // The card's fields, as fresh as the detail.
  Task task = 1;
  optional Person reporter = 2;
  uint64 created_unix_ms = 3;
  // Markdown (Jira's rich text converted).
  string description = 4;
  string acceptance_criteria = 5;
  repeated TaskRef subtasks = 6;
  repeated LinkedTask links = 7;
  repeated TaskAttachment attachments = 8;
  // Oldest first, all of them.
  repeated TaskComment comments = 9;
  repeated string components = 10;
  repeated string fix_versions = 11;
  optional TimeTracking time_tracking = 12;
  // When the source answered.
  uint64 fetched_unix_ms = 13;
  // Served from the cache: the source couldn't be reached.
  bool stale = 14;
  string stale_reason = 15;
  // Where a personal task lives ("Weekly.md · line 14", "Todoist · Inbox").
  string location = 16;
}

message SourceTasks {
  string source_id = 1;
  uint64 version = 2;
  repeated Task tasks = 3;
}

message TaskLink {
  string task_id = 1;
  string worktree_path = 2;
  string branch = 3;
  uint64 created_unix_ms = 4;
}

message WatchTasksRequest {}

message TasksUpdate {
  uint64 version = 1;
  // Every configured source, in order. Tasks of sources not listed are gone.
  repeated TaskSource sources = 2;
  // Task lists that changed since the previous update (all of them in the
  // first one). Lists of other sources stay as they were.
  repeated SourceTasks changed = 3;
  repeated TaskLink links = 4;
}

message DetectSourcesRequest {}

message DetectedSource {
  TaskSourceKind kind = 1;
  string name = 2;
  map<string, string> options = 3;
}

message DetectSourcesResponse {
  repeated DetectedSource sources = 1;
}

message TestSourceRequest {
  // Set to test with the token stored for that source.
  string id = 1;
  TaskSourceKind kind = 2;
  map<string, string> options = 3;
  // A new token; empty uses the stored one.
  string secret = 4;
}

message TestSourceResponse {
  // E.g. "signed in as Ana", "12 open tasks, 40 in total".
  string message = 1;
}

message SaveSourceRequest {
  string id = 1;
  TaskSourceKind kind = 2;
  string name = 3;
  map<string, string> options = 4;
  bool enabled = 5;
  // A new token; empty keeps the stored one.
  string secret = 6;
}

message DeleteSourceRequest {
  string id = 1;
}

message DeleteSourceResponse {}

message SyncTasksRequest {
  string source_id = 1;
}

message SyncTasksResponse {}

message SetTaskStatusRequest {
  string task_id = 1;
  TaskStatus status = 2;
}

message LinkTaskRequest {
  string task_id = 1;
  string worktree_path = 2;
  string branch = 3;
}

message UnlinkTaskRequest {
  string task_id = 1;
  string worktree_path = 2;
}

message UnlinkTaskResponse {}

// ---------------------------------------------------------------------------
// Pipelines: CI runs of a worktree's branch
// ---------------------------------------------------------------------------
//
// The daemon polls the repository's CI (GitHub Actions, GitLab CI, Bitbucket
// Pipelines) with the host's token from the keychain, while someone watches:
// every 10 s while a run is queued or running, every 60 s otherwise, slower
// on errors. Problems come as a kind plus the provider's own short detail;
// the UI words them.

service Pipelines {
  // The latest run of the worktree's branch, pushed whenever it changes.
  // The first message is the first answer (or problem).
  rpc Watch(WatchPipelinesRequest) returns (stream PipelinesSnapshot);
  // Asks the provider now; returns once the new snapshot was pushed.
  rpc Refresh(WorktreeRequest) returns (PipelinesActionResponse);
  // Re-runs the failed jobs of a run (Bitbucket: a new pipeline for the
  // same commit).
  rpc RerunFailed(RerunFailedRequest) returns (PipelinesActionResponse);

  // Hosts of the workspace's repositories, and whether each has a token.
  rpc ListHosts(ListHostsRequest) returns (ListHostsResponse);
  // Saves the host's token in the keychain; an empty token removes it.
  rpc SaveHostToken(SaveHostTokenRequest) returns (CiHostInfo);
  // Checks a token (the given one, or the saved one when empty).
  rpc TestHost(TestHostRequest) returns (TestHostResponse);
  // Opens a terminal running `gh auth login` for a GitHub host; once it's
  // signed in, the host's pipelines are asked again on their own. Kumo
  // never sees what's typed there.
  rpc SignInWithGh(SignInWithGhRequest) returns (SignInWithGhResponse);
}

enum CiProvider {
  CI_PROVIDER_NONE = 0;
  CI_PROVIDER_GITHUB_ACTIONS = 1;
  CI_PROVIDER_GITLAB_CI = 2;
  CI_PROVIDER_BITBUCKET_PIPELINES = 3;
}

enum CiState {
  CI_STATE_QUEUED = 0;
  CI_STATE_RUNNING = 1;
  CI_STATE_PASSED = 2;
  CI_STATE_FAILED = 3;
  CI_STATE_CANCELED = 4;
  CI_STATE_SKIPPED = 5;
}

enum CiProblemKind {
  CI_PROBLEM_KIND_UNSPECIFIED = 0;
  // No token for the host.
  CI_PROBLEM_KIND_NOT_CONNECTED = 1;
  // 401: the token expired or was revoked.
  CI_PROBLEM_KIND_UNAUTHORIZED = 2;
  // 403: the token can't read pipelines (see missing_scope).
  CI_PROBLEM_KIND_FORBIDDEN = 3;
  CI_PROBLEM_KIND_NOT_FOUND = 4;
  // 429, or 403 with no requests left (see retry_at).
  CI_PROBLEM_KIND_RATE_LIMITED = 5;
  // Timeouts, DNS, 5xx.
  CI_PROBLEM_KIND_UNREACHABLE = 6;
  // The branch has no upstream yet (see commits_waiting).
  CI_PROBLEM_KIND_NOT_PUSHED = 7;
  // The repository's host has no supported CI (or no remote).
  CI_PROBLEM_KIND_UNSUPPORTED = 8;
}

message WatchPipelinesRequest {
  string worktree_path = 1;
}

message PipelinesSnapshot {
  CiProvider provider = 1;
  // "owner/name" on the host.
  string repo = 2;
  string branch = 3;
  // The latest run; with a rate-limited or unreachable problem, the last
  // one seen.
  optional CiRun latest = 4;
  optional CiProblem problem = 5;
  // When the provider last answered (Unix ms, 0 = never).
  int64 checked_at = 6;
}

message CiRun {
  // The provider's id, for RerunFailed.
  string id = 1;
  // What the provider calls it: "run #8812", "pipeline #4417".
  string label = 2;
  string short_sha = 3;
  // Subject of the commit it ran for.
  string title = 4;
  CiState state = 5;
  // Unix ms, 0 = unknown.
  int64 created_at = 6;
  int64 finished_at = 7;
  string url = 8;
  repeated CiJob jobs = 9;
}

message CiJob {
  string name = 1;
  CiState state = 2;
  // Finished jobs; 0 = unknown.
  int64 duration_ms = 3;
  // Unix ms, 0 = not started.
  int64 started_at = 4;
  // First useful line of the error, for failed jobs (best effort).
  string failure = 5;
  string url = 6;
}

message CiProblem {
  CiProblemKind kind = 1;
  // The provider's answer, short: "HTTP 403 · Resource not accessible by
  // personal access token". Never contains a token.
  string detail = 2;
  // The permission the token lacks, when the provider says which.
  string missing_scope = 3;
  // When the daemon tries again on its own (Unix ms, 0 = unknown).
  int64 retry_at = 4;
  // Local commits waiting for the first push.
  uint32 commits_waiting = 5;
}

message RerunFailedRequest {
  string worktree_path = 1;
  string run_id = 2;
}

message PipelinesActionResponse {}

message ListHostsRequest {}

message ListHostsResponse {
  repeated CiHostInfo hosts = 1;
}

message CiHostInfo {
  // "github.com", "gitlab.example.com".
  string host = 1;
  CiProvider provider = 2;
  // A token is saved in the keychain.
  bool has_token = 3;
  // No saved token, but the gh CLI is signed in to the host.
  bool uses_gh = 4;
  // Repositories of the workspace on this host ("owner/name").
  repeated string repos = 5;
  // The account gh is signed in as on the host, when it is.
  string gh_account = 6;
  // gh is installed and can sign in to this host (GitHub hosts).
  bool gh_available = 7;
}

message SignInWithGhRequest {
  string host = 1;
}

message SignInWithGhResponse {
  // The terminal running `gh auth login`, to show.
  string terminal_id = 1;
}

message SaveHostTokenRequest {
  string host = 1;
  string token = 2;
}

message TestHostRequest {
  string host = 1;
  // Empty: test the saved one.
  string token = 2;
}

message TestHostResponse {
  // "Signed in as ana" on success.
  string message = 1;
  // Set when the token doesn't work.
  optional CiProblem problem = 2;
}

// ---------------------------------------------------------------------------
// Pull requests (GitLab: merge requests)
// ---------------------------------------------------------------------------
//
// Read from the repository's host with the same token (or gh sign-in) as
// pipelines; problems come as a CiProblem, worded by the UI.

service PullRequests {
  // Open pull requests of a repository, most recently updated first.
  rpc List(ListPullRequestsRequest) returns (PullRequestList);
  // The pull request of a worktree's branch: the open one, else the last
  // merged or closed one.
  rpc ForBranch(BranchPullRequestRequest) returns (BranchPullRequest);
  // Opens a pull request from a worktree's (pushed) branch.
  rpc Create(CreatePullRequestRequest) returns (PullRequest);
}

enum PrState {
  PR_STATE_OPEN = 0;
  PR_STATE_MERGED = 1;
  PR_STATE_CLOSED = 2;
}

enum ReviewState {
  // No review asked for or given.
  REVIEW_STATE_NONE = 0;
  // Reviewers were asked; nobody approved yet.
  REVIEW_STATE_REQUIRED = 1;
  REVIEW_STATE_CHANGES_REQUESTED = 2;
  REVIEW_STATE_APPROVED = 3;
}

message PullRequest {
  uint64 number = 1;
  // As the host shows it: "#521", "!231".
  string label = 2;
  string title = 3;
  Person author = 4;
  // Source and target branches.
  string branch = 5;
  string base = 6;
  bool draft = 7;
  PrState state = 8;
  ReviewState review = 9;
  // Someone asked the user to review it.
  bool review_requested_from_you = 10;
  repeated Person reviewers = 11;
  // Checks on its latest commit: passed of total (0 of 0 = none ran).
  uint32 checks_passed = 12;
  uint32 checks_total = 13;
  // Overall state of those checks; unset when none ran.
  optional CiState checks_state = 14;
  string url = 15;
  // Unix ms.
  int64 created_at = 16;
  int64 updated_at = 17;
  uint32 comment_count = 18;
}

message ListPullRequestsRequest {
  // The repository's main checkout.
  string repo_path = 1;
  // Ask the host even if the last answer is recent.
  bool refresh = 2;
}

message PullRequestList {
  CiProvider provider = 1;
  repeated PullRequest pull_requests = 2;
  // Why they couldn't be read (the list is then empty).
  optional CiProblem problem = 3;
}

message BranchPullRequestRequest {
  string worktree_path = 1;
  bool refresh = 2;
}

message BranchPullRequest {
  CiProvider provider = 1;
  optional PullRequest pull_request = 2;
  optional CiProblem problem = 3;
}

message CreatePullRequestRequest {
  string worktree_path = 1;
  string title = 2;
  // Markdown.
  string body = 3;
  // Target branch; empty = the repository's default branch.
  string base = 4;
  bool draft = 5;
}

// ---------------------------------------------------------------------------
// Docs
// ---------------------------------------------------------------------------

// Pages of the knowledge bases behind the task sources, read only:
// Confluence through a Jira source's Atlassian account, and the notes of
// Obsidian vault sources. Nothing to configure apart from those sources.
service Docs {
  // Each knowledge base's recent pages (the user's own first), or the ones
  // matching a query. Answers are reused for a minute unless `refresh`.
  rpc List(ListDocsRequest) returns (DocList);
  rpc Read(ReadDocRequest) returns (Doc);
}

enum DocKind {
  DOC_KIND_UNSPECIFIED = 0;
  DOC_KIND_CONFLUENCE = 1;
  DOC_KIND_OBSIDIAN = 2;
}

message DocSource {
  // The task source it reads through.
  string id = 1;
  DocKind kind = 2;
  // `acme.atlassian.net`, the vault's folder name.
  string name = 3;
  // The site URL or the vault's path.
  string location = 4;
}

message DocSummary {
  // `<source>/<external>`.
  string id = 1;
  string title = 2;
  // The Confluence space, or the note's folder.
  string place = 3;
  // Unix ms; 0 when unknown.
  int64 updated_at = 4;
  // Who last edited it; empty when unknown.
  string author = 5;
  // Where it opens: the page on the site, `obsidian://` for a note.
  string url = 6;
  // Text around a search match; empty outside a search.
  string excerpt = 7;
}

message DocGroup {
  DocSource source = 1;
  repeated DocSummary docs = 2;
  // Why its pages can't be read; empty when they can.
  string problem = 3;
  // The problem is the account's credentials (fixed in Settings › Tasks).
  bool problem_is_auth = 4;
}

message ListDocsRequest {
  // Empty: recent pages.
  string query = 1;
  // Per knowledge base; 0 = 30.
  uint32 limit = 2;
  bool refresh = 3;
}

message DocList {
  repeated DocGroup groups = 1;
}

message ReadDocRequest {
  string id = 1;
}

message Doc {
  DocSummary summary = 1;
  DocSource source = 2;
  string markdown = 3;
  // Titles above the page: the space or vault, then folders.
  repeated string path = 4;
  // The note's file, for a vault; empty otherwise.
  string file = 5;
}

// ---------------------------------------------------------------------------
// Tests
// ---------------------------------------------------------------------------

// A worktree's tests: its own command (a Makefile `test` target, else the
// usual one for its language), run in a terminal the user can open, and
// what the runner's output says as it goes.
service Tests {
  // The detected command and the latest run, then again whenever the run
  // changes.
  rpc Watch(WatchTestsRequest) returns (stream TestsSnapshot);
  // Stops a run still going in the worktree first.
  rpc Run(RunTestsRequest) returns (TestRun);
  rpc Stop(StopTestsRequest) returns (StopTestsResponse);
}

message WatchTestsRequest {
  string worktree_path = 1;
}

message TestsSnapshot {
  // Empty when none was found.
  string command = 1;
  // Why it was picked, e.g. "Makefile".
  string command_origin = 2;
  // Absent until the worktree runs its tests.
  TestRun run = 3;
}

enum TestRunState {
  TEST_RUN_STATE_RUNNING = 0;
  TEST_RUN_STATE_PASSED = 1;
  TEST_RUN_STATE_FAILED = 2;
  // Stopped before it finished.
  TEST_RUN_STATE_STOPPED = 3;
}

// One package, crate or file of tests.
message TestSuite {
  string name = 1;
  bool passed = 2;
  // 0 when the runner doesn't say.
  uint64 duration_ms = 3;
  uint32 tests = 4;
}

message TestRun {
  string worktree_path = 1;
  string command = 2;
  // Where it runs (open it to see the whole output).
  string terminal_id = 3;
  TestRunState state = 4;
  int32 exit_code = 5;
  uint64 started_unix_ms = 6;
  // 0 while running.
  uint64 finished_unix_ms = 7;
  uint32 passed = 8;
  uint32 failed = 9;
  uint32 skipped = 10;
  repeated TestSuite suites = 11;
  // Names of the failing tests.
  repeated string failures = 12;
  // The latest line printed.
  string last_line = 13;
}

message RunTestsRequest {
  string worktree_path = 1;
  // Empty: the detected command.
  string command = 2;
  uint32 cols = 3;
  uint32 rows = 4;
}

message StopTestsRequest {
  string worktree_path = 1;
}

message StopTestsResponse {}
