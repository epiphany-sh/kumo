[package]
name = "kumod"
description = "The Kumo daemon: composition root that wires every layer and runs the gRPC server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "kumod"
path = "src/lib.rs"

[[bin]]
name = "kumod"
path = "src/main.rs"

[dependencies]
kumo-domain.workspace = true
kumo-application.workspace = true
kumo-infrastructure.workspace = true
kumo-grpc.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
anyhow.workspace = true
clap.workspace = true
dirs.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
kumo-proto.workspace = true
tokio-stream.workspace = true
futures.workspace = true
bytes.workspace = true
tempfile.workspace = true
tonic.workspace = true
serde_json.workspace = true

[lints]
workspace = true
